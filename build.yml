   name: Build

   on:
     push:
     pull_request:

   jobs:
     build:
       name: Build on ${{ matrix.os }}
       runs-on: ${{ matrix.os }}
       strategy:
         fail-fast: false
         matrix:
           os: [ubuntu-latest, windows-latest]

       steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Setup .NET
           uses: actions/setup-dotnet@v4
           with:
             dotnet-version: 10.0.x

         - name: Restore
           run: dotnet restore SchoolJournalEF/SchoolJournalEF.csproj

         - name: Build
           run: dotnet build SchoolJournalEF/SchoolJournalEF.csproj --configuration Release --no-restore